name: wiretap-integration

services:
  wiremock:
    image: sheyenrath/wiremock.net:2.31.0
    ports:
      - '127.0.0.1:${WIREMOCK_TEST_PORT:-18089}:80'
    command: ['--ReadStaticMappings', 'true', '--WireMockLogger', 'WireMockConsoleLogger']
    volumes:
      - wiremock-mappings:/app/__admin/mappings
    healthcheck: &wiremock-health
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /__admin/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  wiremock-secondary:
    image: sheyenrath/wiremock.net:2.31.0
    ports:
      - '127.0.0.1:${WIREMOCK_SECONDARY_TEST_PORT:-18090}:80'
    command: ['--ReadStaticMappings', 'true', '--WireMockLogger', 'WireMockConsoleLogger']
    volumes:
      - wiremock-secondary-mappings:/app/__admin/mappings
    healthcheck: *wiremock-health

  wiretap:
    image: ${WIRETAP_TEST_IMAGE:-wiretap-integration:test}
    build:
      context: .
      dockerfile: Dockerfile.test
    command: ['pnpm', 'dev', '--host', '0.0.0.0', '--port', '3000']
    ports:
      - '127.0.0.1:${WIRETAP_TEST_PORT:-3100}:3000'
    environment:
      NUXT_WIREMOCK_BASE_URL: http://wiremock:80
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: wiretap
    volumes:
      - wiretap-history:/app/.data
    depends_on:
      wiremock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  tests:
    image: ${WIRETAP_TEST_IMAGE:-wiretap-integration:test}
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      WIRETAP_TEST_URL: http://wiretap:3000
      WIREMOCK_TEST_URL: http://wiremock:80
      WIREMOCK_SECONDARY_TEST_URL: http://wiremock-secondary:80
    depends_on:
      wiremock:
        condition: service_healthy
      wiretap:
        condition: service_healthy
      wiremock-secondary:
        condition: service_healthy

volumes:
  wiretap-history:
  wiremock-mappings:
  wiremock-secondary-mappings:
