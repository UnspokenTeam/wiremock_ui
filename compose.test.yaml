name: wiretap-integration

services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - '127.0.0.1:${WIREMOCK_TEST_PORT:-18089}:8080'
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/__admin/health
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  wiremock-secondary:
    image: wiremock/wiremock:3.13.2
    ports:
      - '127.0.0.1:${WIREMOCK_SECONDARY_TEST_PORT:-18090}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:8080/__admin/health'
        ]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  wiretap:
    build:
      context: .
      target: runtime
    ports:
      - '127.0.0.1:${WIRETAP_TEST_PORT:-3100}:3000'
    environment:
      NUXT_WIREMOCK_BASE_URL: http://wiremock:8080
    volumes:
      - wiretap-history:/app/.data
    depends_on:
      wiremock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

  tests:
    build:
      context: .
      target: integration-test
    environment:
      WIRETAP_TEST_URL: http://wiretap:3000
      WIREMOCK_TEST_URL: http://wiremock:8080
      WIREMOCK_SECONDARY_TEST_URL: http://wiremock-secondary:8080
    depends_on:
      wiremock:
        condition: service_healthy
      wiretap:
        condition: service_healthy
      wiremock-secondary:
        condition: service_healthy

volumes:
  wiretap-history:
