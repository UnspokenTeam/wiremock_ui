name: Verify and publish

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      WIRETAP_TEST_IMAGE: wiretap-integration:ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the integration-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: wiretap-integration:ci
          cache-from: type=gha,scope=wiretap-tests
          cache-to: type=gha,mode=max,scope=wiretap-tests
      - name: Lint, type-check, and run unit tests
        run: |
          docker run --rm wiretap-integration:ci pnpm run lint
          docker run --rm wiretap-integration:ci pnpm run typecheck
          docker run --rm wiretap-integration:ci pnpm test
      - name: Run integration tests with real WireMock
        run: |
          docker compose -f compose.test.yaml pull wiremock wiremock-secondary
          docker compose -f compose.test.yaml up --no-build --pull never --wait wiremock wiremock-secondary wiretap
          docker compose -f compose.test.yaml run --rm --no-deps --pull never tests
          bash tests/verify-history-restart.sh
      - name: Test service logs
        if: failure()
        run: docker compose -f compose.test.yaml logs --no-color
      - name: Remove integration stack
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  build:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: wiretap-release:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=wiretap-release
          cache-to: type=gha,mode=max,scope=wiretap-release
      - name: Sign in to GitHub Container Registry
        if: >-
          success() && github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested PR image
        if: >-
          success() && github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:dev-pr-$PR_NUMBER"
          docker tag wiretap-release:ci "$image"
          docker push "$image"

  promote:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Select the previously built image
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "ref=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'map(select(.merged_at != null)) | .[0].number')
            if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
              echo '::error::No merged PR found. Merge a PR with a published dev image before promoting.'
              exit 1
            fi
            echo "ref=$image:dev-pr-$pr" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.source.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Pull, retag, and push
        env:
          SOURCE_IMAGE: ${{ steps.source.outputs.ref }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker pull "$SOURCE_IMAGE"
          while IFS= read -r tag; do
            docker tag "$SOURCE_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$RELEASE_TAGS"
